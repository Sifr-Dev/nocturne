name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sifr-Dev/Cipher
          path: Cipher
      - name: Cache Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: /tmp/zig-x86_64-linux-0.17.1
          key: zig-0.17.1-x86_64-linux
      - name: Install Zig 0.17.1
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ok=
          for url in \
            https://pkg.hexops.org/zig/0.17.1/zig-x86_64-linux-0.17.1.tar.xz \
            https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz; do
            if curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
                 --connect-timeout 20 --max-time 300 "$url" -o /tmp/zig.tar.xz; then
              ok=1; break
            fi
            echo "download failed for $url; trying next mirror"
          done
          test -n "$ok" || { echo "all Zig mirrors failed"; exit 1; }
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
      - name: Add Zig to PATH
        run: echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"
      - name: Install FLAC reference tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flac ffmpeg
      - run: zig build -Dcipher-root=Cipher
      - run: zig build test-audio -Dcipher-root=Cipher --summary all
      - run: zig build test-playback -Dcipher-root=Cipher --summary all
      - run: zig build -Dcipher-root=Cipher -Doptimize=ReleaseSafe
