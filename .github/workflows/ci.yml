name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sifr-Dev/Cipher
          path: Cipher
      - name: Install Zig 0.17.1
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz || \
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 https://pkg.hexops.org/zig/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"
      - name: Install FLAC reference tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flac ffmpeg
      - run: zig build -Dcipher-root=Cipher
      - run: zig build test-audio -Dcipher-root=Cipher --summary all
      - run: zig build -Dcipher-root=Cipher -Doptimize=ReleaseSafe
